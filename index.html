<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>태화라이온스클럽</title>
  <meta name="description" content="태화라이온스클럽 안내 · 일정 · 회원명부" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 캐시 방지: 스타일을 항상 최신으로 -->
  <script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>" />
</head>
<body>

  <!-- ============ 접속 비밀번호 게이트 ============ -->
  <div id="gate">
    <div class="gate-card">
      <img src="logo.jpg" alt="태화라이온스클럽" class="gate-logo" id="gate-logo" />
      <div class="gate-district" id="gate-district">국제라이온스협회 355D(울산·양산)지구</div>
      <div class="gate-title" id="gate-title">태화라이온스클럽</div>
      <div class="gate-slogan" id="gate-slogan">Serve to Change 세상을 바꾸는 봉사</div>
      <input type="password" id="gate-pw" placeholder="비밀번호 입력" autocomplete="off" />
      <button id="gate-submit">입장하기</button>
      <div class="error" id="gate-error"></div>
    </div>
  </div>

  <!-- 헤더: 상단 배너 + 메뉴 -->
  <header>
    <div class="top-banner" data-goto="schedule">
      <img src="logo.jpg" alt="태화라이온스클럽 로고" class="banner-logo" />
      <div class="banner-text">
        <div class="banner-name" id="brand-name">태화라이온스클럽</div>
        <div class="banner-sub" id="brand-sub">국제라이온스협회 355D(울산·양산)지구</div>
      </div>
    </div>
    <nav class="navbar" id="main-nav">
      <a href="#" data-page="schedule">📅 일정표</a>
      <a href="#" data-page="activities">📷 활동내역</a>
      <a href="#" data-page="donations">💰 찬조현황</a>
      <a href="#" data-page="operations">📊 운영현황</a>
      <a href="#" data-page="members">👥 회원명부</a>
      <a href="#" data-page="fee">💳 회비납부안내</a>
      <a href="#" data-page="bylaws">📜 클럽정관</a>
    </nav>
  </header>

  <!-- ============ 일정표 ============ -->
  <div class="page" id="schedule">
    <section class="block">
      <div class="section-title">
        <h2>행사 <span>일정표</span></h2>
        <div class="line"></div>
      </div>
      <div class="timeline" id="events"></div>
    </section>
  </div>

  <!-- ============ 월별 활동내역 ============ -->
  <div class="page" id="activities">
    <section class="block">
      <div class="section-title">
        <h2>월별 <span>활동내역</span></h2>
        <div class="line"></div>
      </div>
      <div id="activities-content"></div>
    </section>
  </div>

  <!-- ============ 찬조현황 ============ -->
  <div class="page" id="donations">
    <section class="block">
      <div class="section-title">
        <h2>찬조 <span>현황</span></h2>
        <div class="line"></div>
      </div>
      <div class="table-note" id="donations-note"></div>
      <div class="member-table-wrap">
        <table class="members" id="donations-table"></table>
      </div>
    </section>
  </div>

  <!-- ============ 운영현황 ============ -->
  <div class="page" id="operations">
    <section class="block">
      <div class="section-title">
        <h2>운영 <span>현황</span></h2>
        <div class="line"></div>
      </div>
      <div class="table-note" id="operations-note"></div>
      <div class="member-table-wrap">
        <table class="members" id="operations-table"></table>
      </div>
    </section>
  </div>

  <!-- ============ 회원명부 ============ -->
  <div class="page" id="members">
    <section class="block">
      <div class="section-title">
        <h2>회원 <span>명부</span></h2>
        <div class="line"></div>
      </div>


      <!-- 명부 -->
      <div id="member-list">
        <div class="member-count" id="member-count"></div>
        <div class="member-table-wrap">
          <table class="members">
            <thead>
              <tr><th>이름</th><th>직책</th><th>연락처</th></tr>
            </thead>
            <tbody id="member-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- ============ 회비납부안내 ============ -->
  <div class="page" id="fee">
    <section class="block">
      <div class="section-title">
        <h2>회비 <span>납부안내</span></h2>
        <div class="line"></div>
      </div>
      <div id="fee-content"></div>
    </section>
  </div>

  <!-- ============ 클럽정관 ============ -->
  <div class="page" id="bylaws">
    <section class="block">
      <div class="section-title">
        <h2>클럽 <span>정관</span></h2>
        <div class="line"></div>
      </div>
      <div class="table-note" id="bylaws-note"></div>
      <div id="bylaws-content"></div>
    </section>
  </div>

  <!-- 푸터 -->
  <footer>
    <div class="f-district" id="foot-district">국제라이온스협회 355D(울산·양산)지구</div>
    <div class="f-brand" id="foot-name">태화라이온스클럽</div>
    <div class="f-slogan" id="foot-slogan">Serve to Change 세상을 바꾸는 봉사</div>
  </footer>

  <!-- 사진 크게보기 -->
  <div id="lightbox">
    <img id="lightbox-img" alt="활동사진" />
  </div>

  <!-- 캐시 방지: data.js(내용)와 app.js를 항상 최신으로 불러오기 -->
  <script>
    (function () {
      var t = Date.now();
      var d = document.createElement("script");
      d.src = "data.js?t=" + t;
      d.onload = function () {
        var a = document.createElement("script");
        a.src = "app.js?t=" + t;
        document.body.appendChild(a);
      };
      document.body.appendChild(d);
    })();
  </script>
</body>
</html>
