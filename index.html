<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>태화라이온스클럽</title>
  <meta name="description" content="태화라이온스클럽 안내 · 일정 · 회원명부" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>" />
</head>
<body>

  <!-- ============ 접속 비밀번호 게이트 ============ -->
  <div id="gate">
    <div class="gate-card">
      <img src="logo.jpg" alt="태화라이온스클럽" class="gate-logo" id="gate-logo" />
      <div class="gate-district" id="gate-district">국제라이온스협회 355D(울산·양산)지구</div>
      <div class="gate-title" id="gate-title">태화라이온스클럽</div>
      <div class="gate-slogan" id="gate-slogan">Serve to Change 세상을 바꾸는 봉사</div>
      <p class="gate-desc">회원 전용 페이지입니다. 비밀번호를 입력해 주세요.</p>
      <input type="password" id="gate-pw" placeholder="비밀번호 입력" autocomplete="off" />
      <button id="gate-submit">입장하기</button>
      <div class="error" id="gate-error"></div>
    </div>
  </div>

  <!-- 헤더 -->
  <header>
    <div class="nav-inner">
      <div class="brand" data-goto="home">
        <img src="logo.jpg" alt="" class="logo-img" />
        <span id="brand-name">태화라이온스클럽</span>
      </div>
      <button class="menu-btn" id="menu-btn" aria-label="메뉴">☰</button>
      <nav id="main-nav">
        <ul>
          <li><a href="#" data-page="home">홈</a></li>
          <li><a href="#" data-page="guide">안내자료</a></li>
          <li><a href="#" data-page="schedule">일정</a></li>
          <li><a href="#" data-page="members">회원명부</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ============ 홈 ============ -->
  <div class="page" id="home">
    <section class="hero">
      <img src="logo.jpg" alt="태화라이온스클럽 로고" class="hero-logo" id="hero-logo" />
      <div class="hero-district" id="hero-district">국제라이온스협회 355D(울산 양산)지구</div>
      <h1 id="hero-name">태화라이온스클럽</h1>
      <p class="slogan" id="hero-slogan">우리는 봉사한다</p>
      <p class="intro" id="hero-intro"></p>
    </section>

    <section class="block">
      <div class="section-title">
        <h2>임원진 <span>안내</span></h2>
        <div class="line"></div>
      </div>
      <div class="officers" id="officers"></div>
    </section>
  </div>

  <!-- ============ 안내자료 ============ -->
  <div class="page" id="guide">
    <section class="block">
      <div class="section-title">
        <h2>클럽 <span>안내자료</span></h2>
        <div class="line"></div>
      </div>
      <div class="cards" id="guides"></div>
    </section>
  </div>

  <!-- ============ 일정 ============ -->
  <div class="page" id="schedule">
    <section class="block">
      <div class="section-title">
        <h2>행사 <span>일정</span></h2>
        <div class="line"></div>
      </div>
      <div class="timeline" id="events"></div>
    </section>
  </div>

  <!-- ============ 회원명부 ============ -->
  <div class="page" id="members">
    <section class="block">
      <div class="section-title">
        <h2>회원 <span>명부</span></h2>
        <div class="line"></div>
      </div>

      <!-- 명부 -->
      <div id="member-list">
        <div class="member-count" id="member-count"></div>
        <div class="member-table-wrap">
          <table class="members">
            <thead>
              <tr><th>이름</th><th>직책</th><th>연락처</th><th>직업</th><th>입회</th></tr>
            </thead>
            <tbody id="member-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- 푸터 -->
  <footer>
    <div class="f-brand" id="foot-name">태화라이온스클럽</div>
    <div id="foot-info"></div>
    <div style="margin-top:12px; opacity:.6; font-size:13px">We Serve · 우리는 봉사한다</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
